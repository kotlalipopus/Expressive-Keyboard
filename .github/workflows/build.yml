name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Android setup
        uses: ./.github/actions/android-setup

      - name: Build Release APK (fast, recommended)
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveKeyboard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExpressiveKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Attach APK to draft release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f keystore/release.keystore ]; then
            echo "No permanent signing key in this run, skipping release upload"
            exit 0
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK built, skipping release upload"
            exit 0
          fi
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v$VERSION"
          NAME="ExpressiveKeyboard-$VERSION-release.apk"
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo "")
          if [ "$IS_DRAFT" != "true" ]; then
            echo "No draft release $TAG, skipping"
            exit 0
          fi
          cp "$APK" "$NAME"
          gh release upload "$TAG" "$NAME" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Uploaded $NAME to draft $TAG"
