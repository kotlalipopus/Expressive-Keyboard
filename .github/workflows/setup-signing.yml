name: Setup signing key

# Одноразовый запуск: создаёт постоянный ключ подписи и кладёт его в репозиторий
# как keystore/release.keystore.b64. Дальше все сборки подписываются им.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          if [ -f keystore/release.keystore.b64 ]; then
            echo "Keystore already exists, nothing to do"
            exit 0
          fi
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass expressive -keypass expressive \
            -dname "CN=Expressive Keyboard, O=Narezany, C=RU"
          base64 -w0 keystore/release.keystore > keystore/release.keystore.b64
          rm -f keystore/release.keystore

      - name: Commit keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keystore/release.keystore.b64
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add permanent signing keystore"
          git push
